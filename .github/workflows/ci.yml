name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same matrix on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  # The ci- prefix keeps this group distinct from any group a calling workflow defines.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # enable-cache stays at its default "auto", which skips the cache on release and tag runs.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Install (fails if uv.lock is stale)
        run: uv sync --all-extras --locked
      - name: Test
        run: uv run --locked pytest -v
      - name: Smoke - lint the generated demo questions
        # examples/data/ is generated, not checked in. The demo set contains deliberate
        # warnings, so this runs without --strict and fails only on errors.
        run: |
          uv run --locked python examples/make_synthetic.py
          uv run --locked s1 lint check examples/data/questions.json

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Check version declarations
        run: uv run --no-project python scripts/release_check.py version
      - name: Build
        run: uv build
      - name: Check metadata
        # Same twine as gh-action-pypi-publish v1.14.3 bundles; 6.x rejects Metadata-Version 2.5.
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Check sdist manifest and installed artifacts
        run: uv run --no-project python scripts/release_check.py dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
