name: Release

# Manual only: dispatching this workflow is the release gate. Run it on a tag,
# e.g. `gh workflow run release.yml --ref v0.14.0 -f index=testpypi`; the guard
# rejects any other ref.
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        required: true
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Check tag ref and version declarations
        env:
          REF: ${{ github.ref }}
        run: uv run --no-project python scripts/release_check.py version --ref "$REF"

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The publish jobs run no checkout and no project code; they upload the dist
  # artifact that ci.yml's package job built and validated in this same run.
  publish-testpypi:
    if: inputs.index == 'testpypi'
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/s1ops/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Off while the repository is private: signing writes the repo, workflow, ref,
          # commit and run URIs to the public Rekor log before the upload, even if the
          # upload then fails. Remove this line when the repository goes public.
          attestations: false

  publish-pypi:
    if: inputs.index == 'pypi'
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/s1ops/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Off while the repository is private; see publish-testpypi.
          attestations: false
