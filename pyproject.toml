[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1ops"
version = "0.1.0"
description = "The System 1 LLMOps platform — calibration, threshold compilation, blind label audit, and shadow drift for reflexive decision models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
typesafe = ["typesafe-sdk>=0.7.1,<0.8"]

[project.scripts]
s1 = "s1ops.cli:main"
s1ops = "s1ops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/s1ops", "src/s1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

