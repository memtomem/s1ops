[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1ops"
version = "0.2.0"
description = "The System 1 LLMOps platform — calibration, threshold compilation, blind label audit, and shadow drift for reflexive decision models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pandas Studio" }]
keywords = ["llmops", "calibration", "classification", "decision-models", "drift", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
typesafe = ["typesafe-sdk>=0.7.1,<0.8"]

[project.urls]
Repository = "https://github.com/memtomem/s1ops"
Documentation = "https://github.com/memtomem/s1ops/tree/main/docs"

[project.scripts]
s1 = "s1ops.cli:main"
s1ops = "s1ops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/s1ops", "src/s1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

