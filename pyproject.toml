[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1ops"
version = "0.14.0"
description = "The System 1 LLMOps platform — calibration, threshold compilation, blind label audit, and shadow drift for reflexive decision models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DAPADA Inc. and s1ops contributors", email = "contact@dapada.co.kr" }]
keywords = ["llmops", "calibration", "classification", "decision-models", "drift", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.9",  # cohen_kappa_score(replace_undefined_by=...) in eval/judge.py
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
typesafe = ["typesafe-sdk>=0.7.1,<0.8"]
openai = ["openai>=3.32,<4"]  # decisions.create(prompt_cache_options=...) is in 3.32+

[project.scripts]
s1 = "s1ops.cli:console_main"
s1ops = "s1ops.cli:console_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/s1ops", "src/s1"]

# Explicit list: CLAUDE.md and docs/ carry local paths and private repo names.
# Hatch still adds .gitignore and PKG-INFO; scripts/release_check.py checks the result.
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "scripts/release_check.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

